<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教室一体机管家 · 教师端</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app.css?v=20261115b">
</head>
<body>

<!-- 登录 -->
<div id="login" class="login-wrap" hidden>
  <form class="login-card" id="loginForm">
    <div class="logo"><span></span></div>
    <h1>教室一体机管家</h1>
    <p class="sub">教师端 · 设备管控与应急授权<br>请使用学校分配的教师账号登录</p>
    <div class="field">
      <label>用户名</label>
      <input type="text" id="loginUser" autocomplete="username" required>
    </div>
    <div class="field">
      <label>密码</label>
      <input type="password" id="loginPass" autocomplete="current-password" required>
    </div>
    <div id="loginError" class="small" style="color:#C0504D;min-height:18px"></div>
    <button class="btn primary block" type="submit" id="loginBtn">登录</button>
  </form>
</div>

<!-- 主界面 -->
<div id="app" class="layout" hidden>
  <aside class="sidebar">
    <div class="brand">
      <div class="mark"></div>
      <div><b>教室一体机管家</b><small>教师端</small></div>
    </div>
    <div class="sidebar-head"><span>设备</span><span id="deviceCount">0/0</span></div>
    <div class="device-list" id="deviceList"></div>
    <div class="sidebar-foot">
      <span id="currentUser">—</span>
      <button class="btn ghost sm" id="logoutBtn">退出</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 id="pageTitle">设备</h1>
      <div class="top-actions">
        <span class="badge off" id="onlineBadge">未选择设备</span>
      </div>
    </header>

    <div class="content">
      <!-- 待审批 -->
      <div class="card" id="approvalCard" hidden>
        <h2>待审批 <span class="hint">卸载 / 退出程序申请</span></h2>
        <div id="approvalList"></div>
      </div>

      <div class="empty" id="emptyState">从左侧选择一台设备</div>

      <div id="devicePanel" hidden>
        <!-- 设备信息 -->
        <div class="card">
          <h2>设备信息 <span class="hint" id="deviceHint"></span></h2>
          <div class="kv">
            <div class="k">名称</div><div class="v" id="infoName">—</div>
            <div class="k">教室</div><div class="v" id="infoClassroom">—</div>
            <div class="k">IP 地址</div><div class="v" id="infoIp">—</div>
            <div class="k">客户端版本</div><div class="v" id="infoVersion">—</div>
            <div class="k">最后在线</div><div class="v" id="infoLastSeen">—</div>
            <div class="k">运行状态</div><div class="v" id="infoRuntime">—</div>
          </div>
        </div>

        <!-- 指令 -->
        <div class="card">
          <h2>快捷操作 <span class="hint">指令经服务器转发，等待设备回执</span></h2>

          <div class="field">
            <label>喊学生到讲台</label>
            <div class="row">
              <input type="text" class="grow" id="callText" value="请到讲台来一下" maxlength="60">
              <button class="btn primary" id="callBtn">喊人</button>
            </div>
          </div>

          <div class="sep"></div>

          <div class="grid2">
            <div class="field">
              <label>通知标题</label>
              <input type="text" id="noticeTitle" value="教师通知" maxlength="40">
            </div>
            <div class="field">
              <label>级别</label>
              <select id="noticeLevel">
                <option value="info">普通</option>
                <option value="warning">提醒</option>
                <option value="urgent">紧急</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label>通知内容</label>
            <textarea id="noticeText" maxlength="300" placeholder="例如：距离考试结束还有 15 分钟"></textarea>
          </div>
          <div class="row right">
            <button class="btn primary" id="noticeBtn">发送通知</button>
          </div>

          <div class="sep"></div>

          <div class="row">
            <button class="btn" id="lockBtn">锁屏</button>
            <button class="btn danger" id="restartBtn">重启</button>
            <button class="btn danger" id="shutdownBtn">关机</button>
          </div>

          <div class="sep"></div>

          <div class="field">
            <label>音量 <span id="volumeValue" class="muted">60</span></label>
            <div class="row">
              <input type="range" id="volumeRange" min="0" max="100" value="60" class="grow">
              <button class="btn" id="volumeBtn">设置</button>
            </div>
          </div>

          <div class="sep"></div>

          <div class="row">
            <button class="btn" id="screenBtn">查看屏幕</button>
            <span class="small muted" id="screenHint"></span>
          </div>
          <div style="margin-top:10px">
            <img id="screenImg" alt="设备截图" hidden
                 style="max-width:100%;border:1px solid #ECEEEF;border-radius:10px">
          </div>
        </div>

        <!-- 策略 -->
        <div class="card">
          <h2>管控策略 <span class="hint">保存后立即下发到该设备</span></h2>

          <div class="grid2">
            <div class="field">
              <label>程序管控模式</label>
              <select id="appMode">
                <option value="0">关闭</option>
                <option value="1">黑名单（命中即拦截）</option>
                <option value="2">白名单（只放行名单内）</option>
              </select>
            </div>
            <div class="field">
              <label>网络管控模式</label>
              <select id="netMode">
                <option value="0">关闭</option>
                <option value="1">黑名单（命中即拦截）</option>
                <option value="2">白名单（只放行名单内）</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label>程序名单（每行一个，支持 * 通配，如 steam.exe、game*.exe）</label>
            <textarea id="appBlacklist" placeholder="steam.exe&#10;wegame.exe"></textarea>
          </div>

          <div class="field">
            <label>域名黑名单（每行一个，支持 *.example.com）</label>
            <textarea id="domainBlacklist" placeholder="*.4399.com&#10;*.7k7k.com"></textarea>
          </div>

          <div class="field">
            <label>IP / CIDR 黑名单（每行一个）</label>
            <textarea id="ipBlacklist" placeholder="203.0.113.7&#10;198.51.100.0/24" style="min-height:54px"></textarea>
          </div>

          <div class="row right">
            <button class="btn primary" id="policyBtn">保存并下发</button>
          </div>
        </div>

        <!-- 一次性密码 -->
        <div class="card">
          <h2>一次性密码 <span class="hint">用于改策略 / 启停 TUN / 退出 / 卸载授权</span></h2>

          <div class="grid3">
            <div class="field">
              <label>数量</label>
              <input type="number" id="otpCount" value="1" min="1" max="10">
            </div>
            <div class="field">
              <label>每个可用次数</label>
              <input type="number" id="otpUses" value="1" min="1" max="10">
            </div>
            <div class="field">
              <label>有效期（分钟）</label>
              <input type="number" id="otpMinutes" value="4320" min="5">
            </div>
          </div>
          <div class="field">
            <label>备注（仅教师端可见）</label>
            <input type="text" id="otpNote" maxlength="60" placeholder="例如：期中考试应急用">
          </div>
          <div class="row right">
            <button class="btn primary" id="otpCreateBtn">生成密码</button>
          </div>

          <div id="otpResult" hidden>
            <div class="token-box">
              <div class="label">明文只显示这一次，请立即抄录/转告</div>
              <div id="otpCodes"></div>
            </div>
          </div>

          <div class="sep"></div>
          <div class="scroll-y">
            <table class="table" id="otpTable">
              <thead><tr><th>编号</th><th>状态</th><th>次数</th><th>到期</th><th>备注</th><th class="right">操作</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <!-- 事件 -->
        <div class="card">
          <h2>最近事件 <span class="hint">拦截记录 / AI 判定 / 设备消息</span></h2>
          <div id="eventList" class="scroll-y"><div class="muted small">暂无事件</div></div>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="toast" class="toast" hidden></div>
<script src="/teacher.js?v=20261115b"></script>
</body>
</html>
